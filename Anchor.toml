[toolchain]
anchor_version = "0.32.1"
solana_version = "2.3.13"

[features]
resolution = true
skip-lint = false

[programs.devnet]
w3swap = "9qPx5xbqg4xZp3BWbtCNGy3GVfZ4WeaeraMUvLBSdcKh"

[programs.localnet]
w3swap = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.mainnet]
w3swap = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
